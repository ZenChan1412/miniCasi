name: CI/CD Quality Pipeline & Cloudflare Pages Deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  validate-and-deploy:
    name: Test, Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 3. Install Dependencies
        run: bun install --frozen-lockfile || bun install

      - name: 4. TypeScript Type Safety Check
        run: bun x tsc --noEmit

      - name: 5. Run Automated Unit & Integration Tests
        run: bun test

      - name: 6. Build Production Artifacts
        run: bun run build

      - name: 7. Deploy to Cloudflare (Production)
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
